# Drop-in de systemd para adbd.service -- NO edita el unit original de
# Arduino (/lib/systemd/system/adbd.service) ni su script
# (adbd-usb-gadget). Se instala aparte, en
# /etc/systemd/system/adbd.service.d/, y sobrevive a una actualización del
# paquete que provee adbd.service.
#
# Agrega un segundo puerto CDC-ACM (acm.GS1) al gadget USB compuesto, para
# el protocolo de vinculación por USB -- ver
# ~/ArduinoApps/blindia/docs/VINCULACION-USB.md.
#
# Por qué hay que re-declarar ExecStartPost/ExecStopPost enteros (con un
# "ExecStartPost=" vacío primero): systemd solo permite AGREGAR al final de
# una lista de ExecStartPost/ExecStopPost vía drop-in, nunca insertar en
# medio. El "activate" original tiene que correr DESPUÉS de que agreguemos
# nuestro puerto (si no, el gadget ya quedó bindeado sin él), así que hace
# falta limpiar la lista heredada y volver a declarar todo en el orden que
# necesitamos: nuestro script, después "activate". Mismo criterio al revés
# para ExecStopPost ("reset" tiene que correr DESPUÉS de que saquemos
# nuestro puerto, si no falla el rmdir del gadget).
#
# Instalación (requiere sudo, ver docs/VINCULACION-USB.md):
#   sudo mkdir -p /etc/systemd/system/adbd.service.d
#   sudo cp ~/ArduinoApps/blindia/scripts/systemd/adbd-usb-vinculacion.conf \
#       /etc/systemd/system/adbd.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart adbd.service
#
# Para revertir (sin tocar nada de Arduino):
#   sudo rm /etc/systemd/system/adbd.service.d/adbd-usb-vinculacion.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart adbd.service

[Service]
ExecStartPost=
ExecStartPost=/home/arduino/ArduinoApps/blindia/scripts/usb_vinculacion_gadget_add.sh
ExecStartPost=/usr/lib/android-sdk/platform-tools/adbd-usb-gadget activate
ExecStopPost=
ExecStopPost=/home/arduino/ArduinoApps/blindia/scripts/usb_vinculacion_gadget_remove.sh
ExecStopPost=/usr/lib/android-sdk/platform-tools/adbd-usb-gadget reset
